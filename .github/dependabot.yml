version: 2
updates:
  # JavaScript dependencies (root, app, admin)
  # Note the bufbuild/connectrpc packages and their peer dependencies are grouped together
  # these are cross dependent across directores, you should:
  #   merge the 3 PRs into one PR
  #   npm install
  #   npx buf generate
  #   cd app && npm run build
  #   cd ../admin && npm run build
  #   commit the regenerated app/src/gen/ and admin/src/gen/ files
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/app"
      - "/admin"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      # Group bufbuild/connectrpc packages and their peer dependencies
      bufbuild-connectrpc:
        applies-to: version-updates
        patterns:
          - "@bufbuild/*"
          - "@connectrpc/*"
          - "@tanstack/react-query"
        update-types:
          - "minor"
          - "patch"
      # Group all other non-major updates together
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "@bufbuild/*"
          - "@connectrpc/*"
          - "@tanstack/react-query"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
