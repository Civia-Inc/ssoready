name: Deploy frontend to prod
on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'admin/**'
      - '.github/workflows/deploy-frontend-prod.yaml'

env:
  AWS_REGION: us-east-2
  APP_DISTRIBUTION_ID: E39K9T36H9BBE2
  ADMIN_DISTRIBUTION_ID: E3VWG5AZKWVZ9W

jobs:
  deploy-app:
    name: Deploy App Frontend
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: ./app
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          APP_API_URL: https://identity-api.govai.com/internal/connect
          APP_APP_URL: https://identity-app.govai.com
          APP_PUBLIC_API_URL: https://identity-api.govai.com
          APP_GOOGLE_OAUTH_CLIENT_ID: 389237239773-dlvu8vjqhou50kirtm68m27kliudicj8.apps.googleusercontent.com
          APP_SENTRY_DSN: https://23aab2055b0af06bab6ee57a822a98c1@o4510262139158528.ingest.us.sentry.io/4510262190342144
          APP_SENTRY_ENVIRONMENT: prod
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync static assets to S3 (with long cache)
        run: |
          aws s3 sync public/ s3://govai-sso-scim-app/ \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*.html" \
            --exclude "config.json"

      - name: Sync HTML files to S3 (with no cache)
        run: |
          aws s3 sync public/ s3://govai-sso-scim-app/ \
            --cache-control "public,max-age=0,must-revalidate" \
            --exclude "*" \
            --include "*.html" \
            --include "config.json"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.APP_DISTRIBUTION_ID }} \
            --paths "/*"

  deploy-admin:
    name: Deploy Admin Frontend
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: ./admin
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          ADMIN_API_URL: https://identity-api.govai.com/internal/connect
          ADMIN_SENTRY_DSN: https://a3bd611fe5ede0958f2b78e5c8df43be@o4510262139158528.ingest.us.sentry.io/4510262195126272
          ADMIN_SENTRY_ENVIRONMENT: prod
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync static assets to S3 (with long cache)
        run: |
          aws s3 sync public/ s3://govai-sso-scim-admin/ \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*.html" \
            --exclude "config.json"

      - name: Sync HTML files to S3 (with no cache)
        run: |
          aws s3 sync public/ s3://govai-sso-scim-admin/ \
            --cache-control "public,max-age=0,must-revalidate" \
            --exclude "*" \
            --include "*.html" \
            --include "config.json"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.ADMIN_DISTRIBUTION_ID }} \
            --paths "/*"
